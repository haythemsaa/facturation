# Nginx Production Configuration
# TunisBusiness Suite v1.0.0
# Optimized for performance, security, and SSL

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Increase worker connections for production
events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_disable "msie6";

    # SSL Configuration (Common)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_status 429;

    # Upstream PHP-FPM
    upstream php-fpm {
        least_conn;
        server app:9000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # HTTP Server (Redirect to HTTPS)
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Allow health checks without SSL
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server (Production)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        root /var/www/html/public;
        index index.php index.html;

        charset utf-8;

        # SSL Certificate (Update paths in production)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Logging
        access_log /var/log/nginx/tunisbusiness-access.log main;
        error_log /var/log/nginx/tunisbusiness-error.log warn;

        # Health check endpoint (public, no auth)
        location ~ ^/(health|api/health) {
            try_files $uri $uri/ /index.php?$query_string;
            access_log off;
        }

        # API endpoints with rate limiting
        location /api/login {
            limit_req zone=auth_limit burst=5 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        location /api/register {
            limit_req zone=auth_limit burst=3 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Static files caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Deny access to sensitive files
        location ~ ^/(\.env|\.git|composer\.(json|lock)|package\.json|artisan|README\.md) {
            deny all;
            access_log off;
            return 404;
        }

        # PHP-FPM handling
        location ~ \.php$ {
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;

            # FastCGI buffering
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;

            # Timeouts
            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 180s;
            fastcgi_read_timeout 180s;

            # Security
            fastcgi_hide_header X-Powered-By;
        }

        # Try files or fallback to index.php
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Deny access to storage (except public storage)
        location ~ ^/storage/(?!app/public/) {
            deny all;
            return 404;
        }
    }

    # HTTP/2 Server Push
    http2_push_preload on;

    # Connection header for WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
}

# ============================================
# PRODUCTION DEPLOYMENT NOTES
# ============================================
#
# 1. SSL Certificates:
#    - Replace /etc/nginx/ssl/fullchain.pem with your certificate
#    - Replace /etc/nginx/ssl/privkey.pem with your private key
#    - For Let's Encrypt: certbot certonly --webroot -w /var/www/html/public -d your-domain.com
#
# 2. Server Name:
#    - Replace "server_name _;" with your actual domain
#    - Example: server_name api.tunisbusiness.tn;
#
# 3. Rate Limiting:
#    - Adjust rate limits based on your needs
#    - Current: 60 req/min for API, 10 req/min for auth
#
# 4. Client Max Body Size:
#    - Currently 50M for file uploads
#    - Adjust based on your upload requirements
#
# 5. Worker Processes:
#    - "auto" detects CPU cores automatically
#    - Manual: worker_processes 4; (for 4 cores)
#
# 6. Logs:
#    - Access log: /var/log/nginx/tunisbusiness-access.log
#    - Error log: /var/log/nginx/tunisbusiness-error.log
#    - Rotate logs with logrotate
#
# 7. Security:
#    - HSTS enabled (31536000s = 1 year)
#    - Security headers included
#    - Hidden files protected
#    - PHP version hidden
#
# 8. Performance:
#    - HTTP/2 enabled
#    - Gzip compression enabled
#    - Static file caching (30 days)
#    - FastCGI buffering optimized
#
# 9. Testing:
#    - Test config: nginx -t
#    - Reload: nginx -s reload
#    - Check SSL: ssllabs.com/ssltest
#
# 10. Monitoring:
#     - Monitor response times in logs
#     - Watch for 429 (rate limit) errors
#     - Monitor upstream health
