# Docker Compose - Production Configuration
# TunisBusiness Suite v1.0.0
#
# Usage:
#   docker compose -f docker-compose.production.yml up -d
#
# Production Features:
#   - Optimized PHP-FPM (OPcache enabled)
#   - Redis for caching & queues
#   - PostgreSQL 15 with persistent volume
#   - Nginx reverse proxy with SSL support
#   - Supervisor for queue workers & scheduler
#   - Health checks on all services
#   - Resource limits & restart policies
#   - Secrets management via environment

version: '3.8'

services:
  # ============================================
  # DATABASE - PostgreSQL 15
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: tunisbusiness_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-facturation}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tunisbusiness_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # CACHE & QUEUES - Redis 7
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: tunisbusiness_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - tunisbusiness_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # APPLICATION - Laravel 11 + PHP 8.2 FPM
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        PHP_VERSION: 8.2
    container_name: tunisbusiness_app_prod
    restart: always
    working_dir: /var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-facturation}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: 6379

      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: "${APP_NAME}"

      LOG_CHANNEL: stack
      LOG_LEVEL: warning
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - app_logs:/var/www/html/storage/logs
    networks:
      - tunisbusiness_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan health:check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      replicas: 2
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================
  # WEB SERVER - Nginx
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: tunisbusiness_nginx_prod
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_SSL_PORT:-443}:443"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - tunisbusiness_network
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================
  # QUEUE WORKER
  # ============================================
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: tunisbusiness_queue_prod
    restart: always
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=300
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-facturation}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: 6379

      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - tunisbusiness_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[q]ueue:work' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      replicas: 2
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================
  # SCHEDULER (Cron)
  # ============================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: tunisbusiness_scheduler_prod
    restart: always
    working_dir: /var/www/html
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-facturation}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: 6379

      LOG_CHANNEL: stack
      LOG_LEVEL: info
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - tunisbusiness_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep 'schedule:run' || exit 1"]
      interval: 120s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

# ============================================
# NETWORKS
# ============================================
networks:
  tunisbusiness_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================
# VOLUMES (Persistent Data)
# ============================================
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/tunisbusiness/postgres

  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/tunisbusiness/redis

  app_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/log/tunisbusiness/app

  nginx_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/log/tunisbusiness/nginx

# ============================================
# PRODUCTION DEPLOYMENT NOTES
# ============================================
#
# 1. Environment Variables:
#    - Copy .env.production.example to .env
#    - Set all required variables (APP_KEY, DB_PASSWORD, etc.)
#    - NEVER commit .env to version control
#
# 2. SSL Certificates:
#    - Place SSL cert/key in ./docker/nginx/ssl/
#    - Update nginx.prod.conf with correct paths
#    - Use Let's Encrypt for free SSL (certbot)
#
# 3. Volume Directories:
#    - Create: /var/lib/tunisbusiness/{postgres,redis}
#    - Create: /var/log/tunisbusiness/{app,nginx}
#    - Set ownership: chown -R 82:82 (nginx user)
#    - Set permissions: chmod 755
#
# 4. Database Migrations:
#    docker compose -f docker-compose.production.yml exec app php artisan migrate --force
#
# 5. Optimize for Production:
#    docker compose -f docker-compose.production.yml exec app php artisan optimize
#    docker compose -f docker-compose.production.yml exec app php artisan config:cache
#    docker compose -f docker-compose.production.yml exec app php artisan route:cache
#    docker compose -f docker-compose.production.yml exec app php artisan view:cache
#
# 6. Monitoring:
#    - Health check: curl http://your-domain/health
#    - Logs: docker compose -f docker-compose.production.yml logs -f app
#    - Stats: docker stats
#
# 7. Backup Strategy:
#    - Automated daily backup at 02:00 (Africa/Tunis)
#    - PostgreSQL: pg_dump via scheduler
#    - Files: rsync storage/ to backup location
#    - Retention: 30 days
#
# 8. Scaling:
#    docker compose -f docker-compose.production.yml up -d --scale app=3 --scale queue=3
#
# 9. Updates:
#    - Pull latest: git pull origin main
#    - Rebuild: docker compose -f docker-compose.production.yml build --no-cache
#    - Deploy: docker compose -f docker-compose.production.yml up -d
#    - Migrate: docker compose -f docker-compose.production.yml exec app php artisan migrate --force
#
# 10. Security:
#     - Change all default passwords
#     - Enable firewall (ufw)
#     - Use fail2ban for SSH
#     - Regular security updates
#     - Monitor logs for suspicious activity
